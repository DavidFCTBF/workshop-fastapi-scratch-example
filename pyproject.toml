[project]
name = "rh"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "David Flores", email = "david.flores@example.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dependency-injector>=4.49.1",
    "fastapi[standard]==0.141.1",
    "greenlet>=3.5.6",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.1.1",
    "strawberry-graphql[fastapi]>=0.328.0",
]

[project.scripts]
rh = "rh:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
